name: android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The shared debug signing key, from a secret (see app/build.gradle.kts).
      # Fork PRs don't get secrets: their builds use the runner's own key.
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 -d > app/debug.keystore
          elif [ "$FORK" = "true" ]; then
            echo "::notice::No DEBUG_KEYSTORE secret on a fork PR: this build is signed with the runner's own key."
          else
            echo "::error::The DEBUG_KEYSTORE secret isn't set: builds wouldn't install over each other."
            exit 1
          fi
      # Robolectric's Android runtime jar (~200 MB), fetched on first use.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test
        run: ./gradlew testDebugUnitTest lintDebug
        env:
          # Also read a tile from the published basemap.
          HIKERATLAS_LIVE: "1"
      - name: Build
        run: ./gradlew assembleDebug
      # Signed with the shared debug key, so it installs over any other
      # debug build.
      - name: Check the debug key
        if: hashFiles('app/debug.keystore') != ''
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /dev/stderr \
            | grep -q "SHA-256 digest: 0de3e1aefa1a47fc04ccc05766ab39fc56a97721322ae0f6816d3b2c3eff7e9d"
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: app/build/reports/

  # The newest main build, for anyone to download without signing in: the
  # website's "Get the Android app" links to releases/latest. One release,
  # tagged "latest", moved to each push to main and its APK replaced. A full
  # release (not a pre-release): GitHub's releases/latest skips those.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, so an older push can't overwrite a newer one's APK.
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-debug
      - name: Publish the latest APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk hiker-atlas.apk
          notes="The newest build of main, from ${GITHUB_SHA::7}: a debug build, signed with the shared debug key, so it installs over earlier ones. Download hiker-atlas.apk on your phone and open it to install."
          # Point the tag at this commit (made on first use).
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes "$notes" --latest
          else
            gh release create latest --title "Latest build" --notes "$notes" --latest --verify-tag
          fi
          gh release upload latest hiker-atlas.apk --clobber
