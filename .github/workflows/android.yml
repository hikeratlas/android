name: android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric's Android runtime jar (~200 MB), fetched on first use.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test
        run: ./gradlew testDebugUnitTest lintDebug
        env:
          # Also read a tile from the published basemap.
          HIKERATLAS_LIVE: "1"
      - name: Build
        run: ./gradlew assembleDebug
      # Signed with the repo's debug key (app/debug.keystore), so it installs
      # over any other debug build, as phones already have.
      - name: Check the debug key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /dev/stderr \
            | grep -q "SHA-256 digest: d44aece1e41acc0599fe7be8f5db7d3f8e0b30c244888851123896ed21213053"
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: app/build/reports/
